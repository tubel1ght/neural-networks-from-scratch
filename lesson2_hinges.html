<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Building Reality from Hinges — Single Hinge Introduction</title>
<style>
:root{--bg:#f6f0e5;--card:#fffdf8;--ink:#1d1d1f;--muted:#666;--line:#d8cfc0;--blue:#1d4ed8;--green:#15803d;--orange:#ea580c;--purple:#7c3aed;--red:#dc2626}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:22px 32px}h1{margin:0;font-size:34px}.sub{margin:6px 0 0;color:var(--muted);font-size:17px}
.lessonNav{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.lessonNav a{text-decoration:none;font-size:14px;font-weight:700;color:#3f3f46;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.lessonNav a:hover{border-color:#c3b9a6}
.lessonNav a.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.wrap{max-width:1420px;margin:0 auto;padding:20px;display:grid;grid-template-columns:420px 1fr;gap:20px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}.side{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto}
.sceneNo{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--muted);font-size:14px;background:#fff}
.question{font-size:30px;line-height:1.12;margin:16px 0 8px;font-weight:800}.oneSentence{font-size:18px;color:#3f3f46;line-height:1.45;margin:0 0 16px}
label{display:block;font-weight:800;margin:15px 0 7px;font-size:16px}input[type=range]{width:100%;accent-color:var(--blue)}
button{border:1px solid #1d4ed8;background:var(--blue);color:white;border-radius:12px;padding:13px 16px;font-weight:800;cursor:pointer;margin-top:10px;font-size:17px}
button.secondary{background:#f5f5f5;color:#222;border-color:#999}button.fit{background:var(--green);border-color:#166534;width:100%;font-size:18px}
button:disabled{opacity:.55;cursor:wait}.nav{display:flex;gap:10px;margin-top:18px}.nav button{width:50%}
.value{float:right;font-weight:900;color:#111}.metric{font-size:32px;font-weight:900;margin:12px 0}
.eq{font-family:ui-monospace,Menlo,Consolas,monospace;background:#f3f0ea;border:1px solid #e5ded2;border-radius:12px;padding:14px;white-space:pre-wrap;line-height:1.5;font-size:13px}
.note{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:12px;margin-top:12px;font-size:14px;line-height:1.4}
canvas{width:100%;height:570px;border:1px solid #eadfce;border-radius:16px;background:#fff}
#net{width:100%;height:390px;border:1px solid #eadfce;border-radius:16px;background:#fff;margin-top:16px;display:none}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:#444;margin-top:10px}.sw{display:inline-block;width:16px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}
.node{fill:#fff;stroke:#111827;stroke-width:2.4}.nodeHidden{fill:#eff6ff;stroke:#1d4ed8;stroke-width:2.3}.nodeOut{fill:#ecfdf5;stroke:#15803d;stroke-width:2.5}
.nodeText{font-size:14px;text-anchor:middle;dominant-baseline:middle;font-weight:800}.edge{stroke:#111827;stroke-width:2;opacity:.85}
.edgeLabel{font-size:13px;fill:#dc2626;font-weight:800;text-anchor:middle}.outLabel{font-size:13px;fill:#ea580c;font-weight:800;text-anchor:middle}
.biasLabel{font-size:13px;fill:#1d4ed8;font-weight:800;text-anchor:middle}.layerLabel{font-size:16px;fill:#111;text-anchor:middle;font-weight:800}
@media(max-width:1000px){.wrap{grid-template-columns:1fr}.side{position:static;max-height:none}canvas{height:470px}}
</style>
</head>
<body>
<header><h1>Building Reality from Hinges</h1><p class="sub">From a line, to adjustable hinges, to a textbook neural network.</p>
<nav class="lessonNav">
<a href="index.html">Home</a>
<a href="lesson1_features.html">1 · Features</a>
<a href="lesson2_hinges.html" class="active">2 · Hinges</a>
<a href="lesson3_ramps.html">3 · Ramps</a>
<a href="lesson4_learning.html">4 · Learning</a>
<a href="lesson5_learned_features.html">5 · Learned features</a>
<a href="lesson6_transformer.html">6 · Transformers</a>
</nav></header>
<div class="wrap">
<section class="panel side">
<span class="sceneNo" id="sceneNo"></span><div class="question" id="question"></div><p class="oneSentence" id="sentence"></p>
<div id="controls"></div><div class="nav"><button class="secondary" id="prev">← Back</button><button id="next">Next →</button></div>
</section>
<main class="panel">
<canvas id="graph" width="1000" height="570"></canvas>
<div class="legend" id="legend">
<span><span class="sw" style="background:#111827"></span>Reality</span>
<span><span class="sw" style="background:#1d4ed8"></span>Model</span>
<span><span class="sw" style="background:#6b7280"></span>Line</span>
<span><span class="sw" style="background:#dc2626"></span>Hinge contributions</span>
</div>
<svg id="net" viewBox="0 0 1000 390"></svg>
</main>
</div>
<script>
const xs=Array.from({length:201},(_,i)=>100*i/200), displayXs=Array.from({length:301},(_,i)=>-100+i), HCOL=["#dc2626","#16a34a","#7c3aed","#ea580c"];
const state={scene:0,x2:50,x3:50,outBias:10,lineSlope:.2,shapeC:50,shapeW:1,shapeA:1,neurons:[{c:25,w:1,a:1},{c:50,w:-1,a:1},{c:65,w:1,a:1},{c:85,w:-1,a:1}]};
const scenes=[
["Why does a line fail?","Start with the simplest support: one line, controlled by a slope and a persistent output bias."],
["Meet the adjustable hinge","A hinge is flat on one side of its bend and sloped on the other. Adjust its bias, bend location, weight, and direction sign."],
["Can two hinges replace the line?","Remove the explicit line. Keep the output bias and combine two independently oriented ReLU hinges."],
["Does a third hinge help?","Three hinges provide three independently placed and oriented bends."],
["Does a fourth hinge help?","A fourth hinge expands the model family, so its best error can never be worse."],
["Where is the neural network?","The same four-hinge model is now drawn in the usual input → hidden → output form. Each “ReLU” box is just a hinge — it stays at zero until its bend, then turns on."]
];
function relu(z){return Math.max(0,z)}
function reality(x){return 100*Math.exp(((x-50-.3*state.x2)**2)/-3000)*(Math.log((110-state.x2)/10)/Math.log(11))*(state.x3/100)}
function activeK(){return state.scene<=1?0:state.scene===2?2:state.scene===3?3:4}
function useLine(){return state.scene===0}
function neuronY(n,x){return n.a*relu(n.w*(x-n.c))}
function modelY(x){let y=state.outBias+(useLine()?state.lineSlope*x:0);for(let i=0;i<activeK();i++)y+=neuronY(state.neurons[i],x);return y}
function rmse(){return Math.sqrt(xs.reduce((s,x)=>{const e=modelY(x)-reality(x);return s+e*e},0)/xs.length)}
function solve(A,y){const n=A[0].length,M=Array.from({length:n},()=>Array(n+1).fill(0));for(let r=0;r<A.length;r++)for(let i=0;i<n;i++){for(let j=0;j<n;j++)M[i][j]+=A[r][i]*A[r][j];M[i][n]+=A[r][i]*y[r]}for(let i=0;i<n;i++){let m=i;for(let r=i+1;r<n;r++)if(Math.abs(M[r][i])>Math.abs(M[m][i]))m=r;[M[i],M[m]]=[M[m],M[i]];let p=M[i][i];if(Math.abs(p)<1e-10)p=p<0?-1e-10:1e-10;for(let j=i;j<=n;j++)M[i][j]/=p;for(let r=0;r<n;r++){if(r===i)continue;const f=M[r][i];for(let j=i;j<=n;j++)M[r][j]-=f*M[i][j]}}return M.map(r=>r[n])}
function basis(x,c,s){return relu(s*(x-c))}
function fitForBasis(selected,withLine){const y=xs.map(reality),A=xs.map(x=>{const row=[1];if(withLine)row.push(x);selected.forEach(h=>row.push(basis(x,h.c,h.s)));return row});const coeff=solve(A,y);const err=Math.sqrt(xs.reduce((sum,x,i)=>{let p=coeff[0],idx=1;if(withLine)p+=coeff[idx++]*x;selected.forEach(h=>p+=coeff[idx++]*basis(x,h.c,h.s));const e=p-y[i];return sum+e*e},0)/xs.length);return{coeff,err}}
function dictionary(){const arr=[];for(let c=-100;c<=200;c+=2){arr.push({c,s:1});arr.push({c,s:-1})}return arr}
function sameBasis(a,b){return a.c===b.c&&a.s===b.s}
function greedyBest(k,withLine){const dict=dictionary();let selected=[];for(let step=0;step<k;step++){let best=null;for(const cand of dict){if(selected.some(h=>sameBasis(h,cand)))continue;const trial=selected.concat([cand]),fit=fitForBasis(trial,withLine);if(!best||fit.err<best.fit.err)best={selected:trial,fit}}selected=best.selected}for(let pass=0;pass<2;pass++)for(let i=0;i<selected.length;i++){let best={selected:selected.slice(),fit:fitForBasis(selected,withLine)};for(const cand of dict){const trial=selected.slice();trial[i]=cand;if(trial.some((h,j)=>j!==i&&sameBasis(h,cand)))continue;const fit=fitForBasis(trial,withLine);if(fit.err<best.fit.err)best={selected:trial,fit}}selected=best.selected}return{selected,fit:fitForBasis(selected,withLine)}}
function applyCanonicalFit(result,withLine){const{selected,fit}=result;let idx=0;state.outBias=fit.coeff[idx++];if(withLine)state.lineSlope=fit.coeff[idx++];selected.forEach((h,i)=>{const q=fit.coeff[idx++],mag=Math.sqrt(Math.abs(q));state.neurons[i].c=h.c;state.neurons[i].w=h.s*mag;state.neurons[i].a=q===0?1:Math.sign(q)*mag})}
async function bestFit(){const btn=document.getElementById("best");btn.disabled=true;btn.textContent="Finding best fit…";await new Promise(r=>setTimeout(r,20));if(state.scene===0){const y=xs.map(reality),A=xs.map(x=>[1,x]),c=solve(A,y);state.outBias=c[0];state.lineSlope=c[1]}else if(state.scene===1){buildScene();return;}else applyCanonicalFit(greedyBest(activeK(),false),false);buildScene()}
function equation(){const parts=[];parts.push(`${state.outBias.toFixed(2)}${useLine()?` ${state.lineSlope>=0?"+":"-"} ${Math.abs(state.lineSlope).toFixed(3)}·x`:""}`);for(let i=0;i<activeK();i++){const n=state.neurons[i],sign=n.a>=0?"+":"-";parts.push(`${sign} ReLU(${n.w.toFixed(3)}·(x − ${n.c.toFixed(1)}))`)}return"model(x) =\n  "+parts.join("\n  ")}
function slider(id,label,val,min,max,step){return`<label>${label}<span class="value" id="${id}Val">${Number(val).toFixed(step<1?2:0)}</span></label><input data-id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${val}">`}
function neuronControls(i){const n=state.neurons[i];return`<div class="note"><b>Hinge ${i+1}</b><label>Hinge location c${i+1}<span class="value" id="cVal${i}">${n.c.toFixed(1)}</span></label><input data-c="${i}" type="range" min="-100" max="200" step="1" value="${n.c}"><label>Weight w${i+1}<span class="value" id="wVal${i}">${n.w.toFixed(2)}</span></label><input data-w="${i}" type="range" min="-8" max="8" step=".05" value="${n.w}"><div style="margin-top:10px;font-size:14px"><b>Direction sign a${i+1}:</b> <span id="aVal${i}">${n.a>0?"+1":"−1"}</span> <span style="color:#666">(chosen by Best fit; no slider)</span></div></div>`}
function shapeEquation(){
  const w=state.shapeW.toFixed(2);
  const c=state.shapeC.toFixed(1);
  const a=state.shapeA>0?"+1":"−1";
  return `hinge(x) = ${state.outBias.toFixed(2)} + ${w}·max(0, ${a}·(x − ${c}))`;
}
function directionControls(){
  return `<label>Direction a</label>
  <div class="note" style="background:#fff;border-color:#ddd">
    <label style="font-weight:600;margin:7px 0">
      <input type="radio" name="shapeA" value="1" ${state.shapeA===1?"checked":""}> +1
    </label>
    <label style="font-weight:600;margin:7px 0">
      <input type="radio" name="shapeA" value="-1" ${state.shapeA===-1?"checked":""}> −1
    </label>
  </div>`;
}
function buildControls(){
  let h="";
  if(state.scene<5){
    h+=slider("x2","Distance to goal",state.x2,0,100,1);
    h+=slider("x3","Shot clearness",state.x3,0,100,1);
  }
  h+=slider("outBias","Output bias",state.outBias,-120,120,.5);

  if(state.scene===0){
    h+=slider("lineSlope","Line slope",state.lineSlope,-5,5,.02);
  }else if(state.scene===1){
    h+=slider("shapeC","Hinge location",state.shapeC,-100,200,1);
    h+=slider("shapeW","Weight w",state.shapeW,-8,8,.05);
    h+=directionControls();
    h+=`<div class="note">The output bias moves the whole hinge up or down. The hinge location chooses where it bends. The direction sign a chooses which side opens. The weight w can be positive or negative, so the open side can slope up or down.</div>`;
  }else{
    for(let i=0;i<activeK();i++)h+=neuronControls(i);
  }

  if(state.scene!==1)h+=`<button class="fit" id="best">Best fit</button>`;
  h+=`<div class="metric" id="errorBox">${state.scene===1?"Explore the hinge":"Error: "+rmse().toFixed(3)}</div>
      <div class="eq" id="modelEq">${state.scene===1?shapeEquation():equation()}</div>`;
  if(state.scene>=2)h+=`<div class="note"><b>Output polarity:</b> the continuous magnitude is absorbed into w. The remaining a is only +1 or −1.</div>`;
  document.getElementById("controls").innerHTML=h;
}
function updateReadouts(){["x2","x3","outBias","lineSlope","shapeC","shapeW"].forEach(id=>{const e=document.getElementById(id+"Val");if(e)e.textContent=Number(state[id]).toFixed(id.includes("Slope")?2:0)});state.neurons.forEach((n,i)=>{const c=document.getElementById("cVal"+i),w=document.getElementById("wVal"+i),a=document.getElementById("aVal"+i);if(c)c.textContent=n.c.toFixed(1);if(w)w.textContent=n.w.toFixed(2);if(a)a.textContent=n.a>0?"+1":"−1"});const er=document.getElementById("errorBox");if(er)er.textContent="Error: "+rmse().toFixed(3);const eq=document.getElementById("modelEq");if(eq)eq.textContent=equation()}
function drawGraph(){
  const c=document.getElementById("graph"),ctx=c.getContext("2d");
  const W=c.width,H=c.height,m={l:76,r:24,t:28,b:62},pw=W-m.l-m.r,ph=H-m.t-m.b;
  const xMin=-100,xMax=200,yMin=-120,yMax=120;
  const X=x=>m.l+(x-xMin)/(xMax-xMin)*pw;
  const Y=y=>m.t+(yMax-y)/(yMax-yMin)*ph;

  ctx.clearRect(0,0,W,H);ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#f3f4f6";
  ctx.fillRect(X(-100),m.t,X(0)-X(-100),ph);
  ctx.fillRect(X(100),m.t,X(200)-X(100),ph);
  ctx.fillStyle="#fffdf5";ctx.fillRect(X(0),m.t,X(100)-X(0),ph);

  ctx.font="bold 14px Arial";ctx.fillStyle="#7c7c84";
  ctx.fillText("No observations",X(-82),m.t+22);
  ctx.fillText("Observed region",X(31),m.t+22);
  ctx.fillText("No observations",X(118),m.t+22);

  ctx.font="15px Arial";ctx.strokeStyle="#e5e7eb";ctx.lineWidth=1;
  for(let y=-120;y<=120;y+=30){
    ctx.beginPath();ctx.moveTo(m.l,Y(y));ctx.lineTo(W-m.r,Y(y));ctx.stroke();
    ctx.fillStyle="#6b7280";ctx.fillText(String(y),m.l-50,Y(y)+5);
  }
  for(let x=-100;x<=200;x+=50){
    ctx.beginPath();ctx.moveTo(X(x),m.t);ctx.lineTo(X(x),H-m.b);ctx.stroke();
    ctx.fillStyle="#6b7280";ctx.fillText(String(x),X(x)-12,H-m.b+24);
  }

  ctx.save();ctx.strokeStyle="#d97706";ctx.lineWidth=2;ctx.setLineDash([6,5]);
  [0,100].forEach(x=>{ctx.beginPath();ctx.moveTo(X(x),m.t);ctx.lineTo(X(x),H-m.b);ctx.stroke()});
  ctx.restore();

  ctx.strokeStyle="#111827";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(m.l,Y(0));ctx.lineTo(W-m.r,Y(0));ctx.stroke();
  ctx.beginPath();ctx.moveTo(m.l,m.t);ctx.lineTo(m.l,H-m.b);ctx.stroke();
  ctx.fillStyle="#111827";ctx.font="17px Arial";ctx.fillText("make %",18,34);ctx.fillText("x1 shot arc",W/2-55,H-14);

  function curve(domain,fn,color,width,dash=[]){
    ctx.save();ctx.beginPath();ctx.rect(m.l,m.t,pw,ph);ctx.clip();
    ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);ctx.beginPath();
    let started=false;
    domain.forEach(x=>{const y=fn(x);if(!Number.isFinite(y)){started=false;return}const px=X(x),py=Y(y);if(!started){ctx.moveTo(px,py);started=true}else ctx.lineTo(px,py)});
    ctx.stroke();ctx.restore();
  }

  if(state.scene!==1) curve(xs,reality,"#111827",5);

  if(state.scene===0){
    curve(displayXs,x=>state.outBias+state.lineSlope*x,"#6b7280",4,[8,6]);
  }else if(state.scene===1){
    const c0=state.shapeC,w0=state.shapeW,a0=state.shapeA;
    const hinge=x=>state.outBias+w0*relu(a0*(x-c0));
    curve(displayXs,hinge,"#1d4ed8",5);
  }else{
    for(let i=0;i<activeK();i++)curve(displayXs,x=>state.outBias+neuronY(state.neurons[i],x),HCOL[i],2.4);
    curve(displayXs,modelY,"#1d4ed8",5,[10,6]);
  }

  if(state.scene!==1){
    ctx.fillStyle="#92400e";ctx.font="bold 13px Arial";
    ctx.fillText("Error is measured only here",X(28),H-m.b-10);
  }
}function drawNetwork(){const svg=document.getElementById("net");if(state.scene!==5){svg.style.display="none";svg.innerHTML="";return}svg.style.display="block";let s="";const line=(x1,y1,x2,y2,cls,label,lx,ly)=>{s+=`<line class="${cls}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;if(label)s+=`<text class="${cls==="edge"?"edgeLabel":"outLabel"}" x="${lx}" y="${ly}">${label}</text>`};const circle=(x,y,r,cls,label)=>{s+=`<circle class="${cls}" cx="${x}" cy="${y}" r="${r}"/><text class="nodeText" x="${x}" y="${y}">${label}</text>`};s+=`<text class="layerLabel" x="110" y="34">Input</text><text class="layerLabel" x="500" y="34">Hidden ReLU neurons</text><text class="layerLabel" x="865" y="34">Output</text>`;circle(110,200,42,"node","x");const ys=[75,155,235,315];ys.forEach((y,i)=>{const n=state.neurons[i],b=-n.w*n.c;line(152,200,390,y,"edge",`w${i+1}=${n.w.toFixed(2)}`,270,(200+y)/2-8);s+=`<circle class="nodeHidden" cx="500" cy="${y}" r="62"/><text x="500" y="${y-18}" text-anchor="middle" style="font-size:14px;font-weight:800">ReLU(w${i+1}x+b${i+1})</text><text class="biasLabel" x="500" y="${y+6}">b${i+1}=${b.toFixed(2)}</text><text x="500" y="${y+28}" text-anchor="middle" style="font-size:12px;fill:#666">c${i+1}=${n.c.toFixed(1)}</text>`;line(562,y,823,200,"out",`a${i+1}=${n.a>0?"+1":"−1"}`,690,(200+y)/2-8)});circle(865,200,48,"nodeOut","ŷ");s+=`<text class="biasLabel" x="865" y="270">output bias=${state.outBias.toFixed(2)}</text><text x="500" y="375" text-anchor="middle" style="font-size:14px;fill:#555;font-weight:700">Because bᵢ = −wᵢcᵢ, the hinge-location slider maps exactly to the textbook neuron. Each output polarity aᵢ is fixed to +1 or −1.</text>`;svg.innerHTML=s}
function updateScene(){document.getElementById("sceneNo").textContent=`Scene ${state.scene+1} of 6`;document.getElementById("question").textContent=scenes[state.scene][0];document.getElementById("sentence").textContent=scenes[state.scene][1];document.getElementById("prev").disabled=state.scene===0;document.getElementById("next").textContent=state.scene===5?"Done":"Next →"}
function updateAll(){
  updateReadouts();
  drawGraph();
  drawNetwork();
  const legend=document.getElementById("legend");
  if(legend) legend.style.display=state.scene===1?"none":"flex";
}function buildScene(){updateScene();buildControls();updateAll()}
document.getElementById("controls").addEventListener("input",e=>{
  const t=e.target;
  if(t.name==="shapeA") state.shapeA=Number(t.value);
  else if(t.dataset.id) state[t.dataset.id]=+t.value;
  else if(t.dataset.c) state.neurons[+t.dataset.c].c=+t.value;
  else if(t.dataset.w) state.neurons[+t.dataset.w].w=+t.value;
  updateAll();
});
document.getElementById("controls").addEventListener("click",e=>{if(e.target.id==="best")bestFit()});document.getElementById("prev").onclick=()=>{if(state.scene>0){state.scene--;buildScene()}};document.getElementById("next").onclick=()=>{if(state.scene<5){state.scene++;buildScene()}};buildScene();
</script></body></html>
