<script>
const N=31;
const axis=Array.from({length:N},(_,i)=>100*i/(N-1));
const trainAxis=Array.from({length:11},(_,i)=>100*i/10);
// A wider domain for the single-ramp "understanding" scenes, so the fold line
// and both sides of a ramp are visible beyond the 0-100 observation box.
const WLO=-40, WHI=140, WIDE_Z=[-150,150];
const wideAxis=Array.from({length:46},(_,i)=>WLO+(WHI-WLO)*i/45);
const DEFAULT_CAMERA={eye:{x:1.55,y:1.55,z:1.15}};
const INK="#111827", PARAM="#dc2626";
const state={
  scene:0,
  matrixStep:0,
  x3:50,
  outBias:0,
  ramps:[
    {w1:1.0,w2:0.4,b:-55,a:1},
    {w1:-0.8,w2:0.9,b:-15,a:1},
    {w1:0.5,w2:-1.0,b:30,a:-1}
  ],
  camera:JSON.parse(JSON.stringify(DEFAULT_CAMERA))
};
const scenes=[
["What happens when a hinge gets a second input?","Explore one adjustable ramp. Two input weights control its tilt; one bias controls where the flat region meets the slope."],
["Where does the ramp turn on?","Reveal the turn-on line (the “activation boundary”): on one side the ramp is flat at zero, on the other it tilts upward as a sloped plane."],
["How do the weights rotate the boundary?","Compare the 3D ramp with a top-down view. Changing w₁ and w₂ rotates the cut through feature space."],
["What two-feature reality are we trying to model?","Now reveal the make-probability landscape produced by a shot's arc and its distance to the goal."],
["Can one ramp fit the landscape?","Try one ramp against reality. A single planar bend cannot capture the whole curved landscape."],
["Can two ramps do better?","Add two independently oriented ramps and inspect their individual contributions and their sum."],
["Does a third ramp help?","A third ramp gives the model more flexibility, so it can hug the landscape more closely — its best possible error can only get smaller, never larger."],
["Where is the neural network?","The same three-ramp model is now shown as a standard two-input, one-hidden-layer neural network."],
["From network to matrix multiply","Add one more input, then watch the whole layer collapse into a single matrix multiply — the operation GPUs are built to run fast."],
["Why do we need learning?","Even this tiny model already has many parameters. Larger models make manual tuning impossible."]
];

function relu(z){return Math.max(0,z)}
function reality(x1,x2){
  return 100*Math.exp(((x1-40-0.3*x2)**2)/-3000)*(Math.log((110-x2)/10)/Math.log(11))*(state.x3/100);
}
function rampValue(r,x1,x2){return r.a*relu(r.w1*x1+r.w2*x2+r.b)}
function activeK(){return state.scene<5?1:state.scene===5?2:3}
function modelValue(x1,x2,k=activeK()){
  let y=state.outBias;
  for(let i=0;i<k;i++)y+=rampValue(state.ramps[i],x1,x2);
  return y;
}
function grid(fn,arr=axis){return arr.map(y=>arr.map(x=>fn(x,y)))}
function rmse(k=activeK()){
  let s=0,n=0;
  for(const x2 of trainAxis)for(const x1 of trainAxis){
    const e=modelValue(x1,x2,k)-reality(x1,x2);s+=e*e;n++;
  }
  return Math.sqrt(s/n);
}
function sceneLayout(title,zRange=[0,120],xyRange=[0,100]){
  return {
    title:{text:title,font:{size:16}},
    margin:{l:0,r:0,t:45,b:0},
    paper_bgcolor:"#fff",plot_bgcolor:"#fff",
    scene:{
      xaxis:{title:"Shot arc x₁",range:xyRange},
      yaxis:{title:"Distance x₂",range:xyRange},
      zaxis:{title:"Make % / ramp output",range:zRange},
      camera:state.camera,
      aspectmode:"cube"
    },
    showlegend:false
  };
}
function surfaceTrace(z,name,opacity=1,colorscale="Viridis",ax=axis){
  return {type:"surface",x:ax,y:ax,z,name,opacity,colorscale,showscale:false,hovertemplate:"x₁=%{x:.1f}<br>x₂=%{y:.1f}<br>z=%{z:.2f}<extra></extra>"};
}
// Translucent outline of the 0-100 observation box, drawn at z=0 so students
// can see where the training data lives relative to the extended ramp.
function dataBoxTrace(){
  return {type:"scatter3d",mode:"lines",
    x:[0,100,100,0,0],y:[0,0,100,100,0],z:[0,0,0,0,0],
    line:{width:5,color:"#111827"},name:"data box (0–100)",hoverinfo:"skip"};
}
function boundaryTrace(r,lo=0,hi=100,ax=axis){
  const pts=[];
  if(Math.abs(r.w2)>1e-8){
    for(const x of ax){
      const y=-(r.w1*x+r.b)/r.w2;
      if(y>=lo&&y<=hi)pts.push([x,y]);
    }
  }else if(Math.abs(r.w1)>1e-8){
    const x=-r.b/r.w1;
    if(x>=lo&&x<=hi)for(const y of ax)pts.push([x,y]);
  }
  return {type:"scatter3d",mode:"lines",x:pts.map(p=>p[0]),y:pts.map(p=>p[1]),z:pts.map(()=>0),line:{width:8},name:"Activation boundary",hoverinfo:"skip"};
}
function topDownData(r,ax=axis){
  const z=grid((x1,x2)=>r.w1*x1+r.w2*x2+r.b,ax);
  return [
    {type:"heatmap",x:ax,y:ax,z,colorscale:"RdBu",zmid:0,showscale:false,hovertemplate:"x₁=%{x:.1f}<br>x₂=%{y:.1f}<br>before bend=%{z:.2f}<extra></extra>"},
    {type:"contour",x:ax,y:ax,z,contours:{start:0,end:0,size:1,coloring:"lines"},line:{width:4},showscale:false,hoverinfo:"skip"}
  ];
}
function bindCamera(id){
  const el=document.getElementById(id);
  if(!el||el._cameraBound)return;
  el._cameraBound=true;
  el.on("plotly_relayout",ev=>{
    if(ev["scene.camera"]&&!cameraSyncInProgress)state.camera=ev["scene.camera"];
  });
}
let cameraSyncInProgress=false;
// Snap every 3D plot currently on the page back to the default camera angle.
function resetView(){
  state.camera=JSON.parse(JSON.stringify(DEFAULT_CAMERA));
  cameraSyncInProgress=true;
  const ids=["mainPlot","ramp3d","realityPlot","sumPlot","rampPlot0","rampPlot1","rampPlot2"];
  const updates=ids
    .filter(id=>{const el=document.getElementById(id);return el&&el._fullLayout&&el._fullLayout.scene;})
    .map(id=>Plotly.relayout(id,{"scene.camera":state.camera}));
  Promise.allSettled(updates).finally(()=>{cameraSyncInProgress=false;});
}
function syncCameras(ids){
  ids.forEach(id=>{
    const el=document.getElementById(id);
    if(!el||el._syncBound)return;
    el._syncBound=true;
    el.on("plotly_relayout",ev=>{
      if(!ev["scene.camera"]||cameraSyncInProgress)return;
      state.camera=ev["scene.camera"];
      cameraSyncInProgress=true;
      const updates=ids
        .filter(other=>other!==id&&document.getElementById(other))
        .map(other=>Plotly.relayout(other,{"scene.camera":state.camera}));
      Promise.allSettled(updates).finally(()=>{cameraSyncInProgress=false;});
    });
  });
}
function slider(path,label,value,min,max,step){
  const rid="readout_"+path.replaceAll(".","_");
  return `<label>${label}<span class="value" id="${rid}">${Number(value).toFixed(step<1?2:0)}</span></label>
  <input type="range" data-path="${path}" data-step="${step}" min="${min}" max="${max}" step="${step}" value="${value}">`;
}
function subscriptNumber(n){
  const map={"0":"₀","1":"₁","2":"₂","3":"₃","4":"₄","5":"₅","6":"₆","7":"₇","8":"₈","9":"₉"};
  return String(n).split("").map(ch=>map[ch]||ch).join("");
}
function weightName(hiddenIndex,inputIndex){
  return "w"+subscriptNumber(hiddenIndex+1)+subscriptNumber(inputIndex+1);
}
function rampControls(i){
  const r=state.ramps[i];
  return `<div class="rampBox"><div class="rampTitle">Ramp ${i+1}</div>
  ${slider(`ramps.${i}.w1`,`Weight ${weightName(i,0)}`,r.w1,-3,3,.05)}
  ${slider(`ramps.${i}.w2`,`Weight ${weightName(i,1)}`,r.w2,-3,3,.05)}
  ${slider(`ramps.${i}.b`,`Bias b${subscriptNumber(i+1)}`,r.b,-200,200,1)}
  <label>Output direction a${subscriptNumber(i+1)}</label>
  <div style="display:flex;gap:18px">
    <label style="font-weight:600;margin:0"><input type="radio" name="a${i}" data-a="${i}" value="1" ${r.a===1?"checked":""}> +1</label>
    <label style="font-weight:600;margin:0"><input type="radio" name="a${i}" data-a="${i}" value="-1" ${r.a===-1?"checked":""}> −1</label>
  </div></div>`;
}
function equation(k=activeK()){
  const lines=[`${state.outBias.toFixed(2)}`];
  for(let i=0;i<k;i++){
    const r=state.ramps[i];
    lines.push(`${r.a>0?"+":"-"} ReLU(${r.w1.toFixed(2)}x₁ ${r.w2>=0?"+":"-"} ${Math.abs(r.w2).toFixed(2)}x₂ ${r.b>=0?"+":"-"} ${Math.abs(r.b).toFixed(1)})`);
  }
  return "model(x₁,x₂) =\n  "+lines.join("\n  ");
}
function buildControls(){
  let h="";
  if(state.scene>=3 && state.scene<=7){
    h+=`<div class="realityBox"><div class="realityTitle">Fixed input</div>
    <div class="realityText">This describes the shot itself (the reality). Keep it fixed while tuning the model below, or move it to reshape the target landscape.</div>
    ${slider("x3","x3 (goal visibility)",state.x3,10,100,1)}</div>`;
  }
  if(state.scene<=2){
    h+=rampControls(0);
    h+=`<div class="note"><b>One ramp:</b> z = max(0, w₁x₁ + w₂x₂ + b). The <code>max(0, …)</code> is the “ReLU”: it keeps the ramp flat at zero until the bend, then lets it rise. The weights tilt and rotate it; the bias slides the turn-on line. The output direction <b>a₁</b> flips the whole ramp over: <b>+1</b> makes it rise, <b>−1</b> makes it fall — exactly like a hinge pointing up or down in Lesson 2. The dashed square marks the <b>0–100 data region</b>; the surface is drawn a bit beyond it (like the hinges in Lesson 2) so you can see the whole ramp and where its fold line sits.</div>`;
  }else if(state.scene===3){
    h+=`<div class="note">Reality depends nonlinearly on both inputs. Rotate the surface and look for the arc “sweet spot” shifting as distance changes.</div>`;
  }else if(state.scene>=4 && state.scene<=7){
    h+=slider("outBias","Output bias",state.outBias,-100,120,.5);
    const k=state.scene===4?1:state.scene===5?2:3;
    for(let i=0;i<k;i++)h+=rampControls(i);
    h+=`<button class="fit" id="best">Best fit</button>
         <div class="metric" id="errorBox">Error: ${rmse(k).toFixed(3)}</div>
         <div class="eq" id="modelEq">${equation(k)}</div>`;
  }else if(state.scene===8){
    const step=state.matrixStep||0;
    h+=`<div class="mxSteps">
      <button data-step="0" class="${step===0?"activeStep":"secondary"}">Step 1</button>
      <button data-step="1" class="${step===1?"activeStep":"secondary"}">Step 2</button>
      <button data-step="2" class="${step===2?"activeStep":"secondary"}">Step 3</button>
    </div>
    <div class="note">Walk the three steps: <b>1</b> add a feature, <b>2</b> fold the whole layer into one matrix multiply, <b>3</b> batch many shots into a matrix–matrix multiply — the operation fast GPU/TPU hardware is built to accelerate.</div>`;
  }else if(state.scene===9){
    h+=`<div class="note">A model with H hidden ramps and D inputs has approximately H(D+2)+1 parameters: D input weights, one hidden bias, one output weight per ramp, plus an output bias.</div>`;
  }
  document.getElementById("controls").innerHTML=h;
}
function setPath(path,val){
  const parts=path.split(".");
  if(parts.length===1)state[parts[0]]=val;
  else state[parts[0]][Number(parts[1])][parts[2]]=val;
}
const fitCache=new Map();

const fitSamples=[];
for(const x2 of trainAxis){
  for(const x1 of trainAxis){
    fitSamples.push({x1,x2,y:reality(x1,x2)});
  }
}

function refreshFitSamples(){
  let idx=0;
  for(const x2 of trainAxis){
    for(const x1 of trainAxis){
      fitSamples[idx++].y=reality(x1,x2);
    }
  }
}

function oneRampFitForCandidate(u1,u2,t){
  // Model: bias + q * ReLU(u1*x1 + u2*x2 + t)
  // Solve bias and q directly from two-variable least squares.
  let n=0,sumH=0,sumY=0,sumHH=0,sumHY=0;
  for(const s of fitSamples){
    const h=relu(u1*s.x1+u2*s.x2+t);
    n++;
    sumH+=h;
    sumY+=s.y;
    sumHH+=h*h;
    sumHY+=h*s.y;
  }
  const det=n*sumHH-sumH*sumH;
  let bias,q;
  if(Math.abs(det)<1e-12){
    q=0;
    bias=sumY/n;
  }else{
    bias=(sumY*sumHH-sumH*sumHY)/det;
    q=(n*sumHY-sumH*sumY)/det;
  }

  let sse=0;
  for(const s of fitSamples){
    const h=relu(u1*s.x1+u2*s.x2+t);
    const e=(bias+q*h)-s.y;
    sse+=e*e;
  }
  return {bias,q,err:Math.sqrt(sse/n)};
}

function candidateGrid(){
  const arr=[];
  for(let deg=0;deg<360;deg+=30){
    const rad=deg*Math.PI/180;
    const u1=Math.cos(rad),u2=Math.sin(rad);
    for(let t=-120;t<=120;t+=20){
      arr.push({u1,u2,t,deg});
    }
  }
  return arr;
}
const CANDIDATES=candidateGrid();

function fitOneRampFast(){
  let best=null;
  for(const c of CANDIDATES){
    const fit=oneRampFitForCandidate(c.u1,c.u2,c.t);
    if(!best||fit.err<best.fit.err)best={c,fit};
  }

  // Tiny local refinement around the best coarse candidate.
  let current=best;
  for(const dDeg of [-10,-5,0,5,10]){
    for(const dT of [-10,-5,0,5,10]){
      const deg=(best.c.deg+dDeg+360)%360;
      const rad=deg*Math.PI/180;
      const c={u1:Math.cos(rad),u2:Math.sin(rad),t:best.c.t+dT,deg};
      const fit=oneRampFitForCandidate(c.u1,c.u2,c.t);
      if(fit.err<current.fit.err)current={c,fit};
    }
  }
  return current;
}

function residualSamples(k){
  const arr=[];
  for(const s of fitSamples){
    let pred=state.outBias;
    for(let i=0;i<k;i++)pred+=rampValue(state.ramps[i],s.x1,s.x2);
    arr.push({x1:s.x1,x2:s.x2,y:s.y-pred});
  }
  return arr;
}

function fitAdditionalRampFast(existingK){
  // Fit one additional ramp to the current residual.
  const residual=residualSamples(existingK);
  let best=null;

  for(const c of CANDIDATES){
    let n=0,sumH=0,sumY=0,sumHH=0,sumHY=0;
    for(const s of residual){
      const h=relu(c.u1*s.x1+c.u2*s.x2+c.t);
      n++;sumH+=h;sumY+=s.y;sumHH+=h*h;sumHY+=h*s.y;
    }
    const det=n*sumHH-sumH*sumH;
    let biasAdj=0,q=0;
    if(Math.abs(det)>=1e-12){
      biasAdj=(sumY*sumHH-sumH*sumHY)/det;
      q=(n*sumHY-sumH*sumY)/det;
    }
    let sse=0;
    for(const s of residual){
      const h=relu(c.u1*s.x1+c.u2*s.x2+c.t);
      const e=(biasAdj+q*h)-s.y;
      sse+=e*e;
    }
    const err=Math.sqrt(sse/n);
    if(!best||err<best.err)best={c,q,biasAdj,err};
  }
  return best;
}

function applyRampFromBasis(index,c,q){
  const mag=Math.abs(q);
  state.ramps[index]={
    w1:mag*c.u1,
    w2:mag*c.u2,
    b:mag*c.t,
    a:q<0?-1:1
  };
}

function fitBiasExactly(k){
  let sum=0,n=0;
  for(const s of fitSamples){
    let contrib=0;
    for(let i=0;i<k;i++)contrib+=rampValue(state.ramps[i],s.x1,s.x2);
    sum+=s.y-contrib;
    n++;
  }
  state.outBias=sum/n;
}

async function bestFit(){
  const k=state.scene===4?1:state.scene===5?2:3;
  const btn=document.getElementById("best");
  if(btn){btn.disabled=true;btn.textContent="Fitting…";}
  await new Promise(r=>setTimeout(r,10));

  refreshFitSamples();
  const key=`${state.x3.toFixed(3)}|${k}`;

  if(fitCache.has(key)){
    const cached=fitCache.get(key);
    state.outBias=cached.outBias;
    for(let i=0;i<k;i++)state.ramps[i]={...cached.ramps[i]};
  }else{
    const first=fitOneRampFast();
    state.outBias=first.fit.bias;
    applyRampFromBasis(0,first.c,first.fit.q);
    fitBiasExactly(1);

    for(let i=1;i<k;i++){
      const add=fitAdditionalRampFast(i);
      state.outBias+=add.biasAdj;
      applyRampFromBasis(i,add.c,add.q);
      fitBiasExactly(i+1);
    }

    fitCache.set(key,{
      outBias:state.outBias,
      ramps:state.ramps.slice(0,k).map(r=>({...r}))
    });
  }

  buildControls();
  renderScene();
}

  Plotly.react("mainPlot",traces,sceneLayout(boundary?"Ramp and activation boundary":"One adjustable ramp",WIDE_Z,[WLO,WHI]),{responsive:true,displaylogo:false});

function renderFitScene(k){
  const cards=[["Reality","realityPlot"],["Model sum","sumPlot"]];
  for(let i=0;i<k;i++)cards.push([`Ramp ${i+1}`,`rampPlot${i}`]);
  const expected=`rampPlot${k-1}`;
  if(!document.getElementById("realityPlot")||!document.getElementById(expected)){
    document.getElementById("plotArea").innerHTML='<div class="plotGrid">'+cards.map(([t,id])=>`<div class="plotCard"><div class="plotTitle">${t}</div><div id="${id}" class="smallPlot"></div></div>`).join("")+'</div>';
  }
  Plotly.react("realityPlot",[surfaceTrace(grid(reality),"Reality",1,"Viridis")],sceneLayout("",[-30,120]),{responsive:true,displaylogo:false});
  Plotly.react("sumPlot",[surfaceTrace(grid((x1,x2)=>modelValue(x1,x2,k)),"Model",1,"Blues")],sceneLayout("",[-30,120]),{responsive:true,displaylogo:false});
  for(let i=0;i<k;i++)Plotly.react(`rampPlot${i}`,[surfaceTrace(grid((x1,x2)=>rampValue(state.ramps[i],x1,x2)),`Ramp ${i+1}`,1,i===0?"Reds":i===1?"Greens":"Purples")],sceneLayout("",[-80,120]),{responsive:true,displaylogo:false});
  syncCameras(["realityPlot","sumPlot",...Array.from({length:k},(_,i)=>`rampPlot${i}`)]);
}
function renderNetwork(){
  if(!document.getElementById("sumPlot")){
    document.getElementById("plotArea").innerHTML='<div id="sumPlot" style="height:430px"></div>';
  }
  Plotly.react(
    "sumPlot",
    [surfaceTrace(grid((x1,x2)=>modelValue(x1,x2,3)),"Model",1,"Blues")],
    sceneLayout("Three-ramp model",[-30,120]),
    {responsive:true,displaylogo:false}
  );
  bindCamera("sumPlot");

  const svg=document.getElementById("network");
  svg.style.display="block";
  let s="";

  function edge(x1,y1,x2,y2,label,lx,ly){
    s+=`<line class="edge" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
    if(label)s+=`<text x="${lx}" y="${ly}" text-anchor="middle" style="font-size:13px;font-weight:800;fill:${PARAM}">${label}</text>`;
  }
  function box(x,y,w,h,cls,html){
    s+=`<rect class="${cls}" x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="18"/>${html}`;
  }
  function inputBox(x,y,sym,name){
    box(x,y,155,65,"node",
      `<text x="${x}" y="${y-2}" text-anchor="middle" style="font-size:23px;font-weight:900;fill:${INK}">${sym}</text>`+
      `<text x="${x}" y="${y+20}" text-anchor="middle" style="font-size:12px;fill:#555">${name}</text>`);
  }

  s+=`<text class="layer" x="110" y="35">Input features</text>`;
  s+=`<text class="layer" x="515" y="35">Ramps</text>`;
  s+=`<text class="layer" x="850" y="35">Output</text>`;
  s+=`<text class="layer" x="1020" y="35">Error</text>`;

  inputBox(110,155,"x₁","shot arc");
  inputBox(110,330,"x₂","distance");

  const ys=[105,245,385];
  ys.forEach((y,i)=>{
    const r=state.ramps[i];
    const w1=weightName(i,0);
    const w2=weightName(i,1);
    const b="b"+subscriptNumber(i+1);
    const a="a"+subscriptNumber(i+1);

    edge(188,155,380,y,`${w1}=${r.w1.toFixed(2)}`,282,(155+y)/2-7);
    edge(188,330,380,y,`${w2}=${r.w2.toFixed(2)}`,282,(330+y)/2+14);

    box(515,y,272,85,"hidden",
      `<text x="515" y="${y-8}" text-anchor="middle" style="font-size:14px;font-weight:800;fill:${INK}">ReLU(<tspan fill="${PARAM}">${w1}</tspan>x₁ + <tspan fill="${PARAM}">${w2}</tspan>x₂ + <tspan fill="${PARAM}">${b}</tspan>)</text>`+
      `<text x="515" y="${y+15}" text-anchor="middle" style="font-size:12px;font-weight:700;fill:${PARAM}">${b}=${r.b.toFixed(2)}</text>`);

    edge(650,y,770,245,`${a}=${r.a>0?"+1":"−1"}`,710,(y+245)/2-8);
  });

  box(850,245,152,104,"out",
    `<text x="850" y="237" text-anchor="middle" style="font-size:13px;font-weight:800;fill:${INK}">y = sum + <tspan fill="${PARAM}">bias</tspan></text>`+
    `<text x="850" y="259" text-anchor="middle" style="font-size:12px;font-weight:700;fill:${PARAM}">bias=${state.outBias.toFixed(2)}</text>`);

  edge(925,245,972,245,"",0,0);
  box(1020,245,90,104,"err",
    `<text x="1020" y="240" text-anchor="middle" style="font-size:14px;font-weight:800;fill:${INK}">Error</text>`+
    `<text x="1020" y="262" text-anchor="middle" style="font-size:13px;font-weight:700;fill:${INK}">${rmse(3).toFixed(3)}</text>`);

  svg.innerHTML=s;
}
function renderCounts(){
  document.getElementById("plotArea").innerHTML='';
  document.getElementById("network").style.display="none";
  const examples=[
    ["1 ramp, 2 inputs",5],
    ["3 ramps, 2 inputs",13],
    ["10 ramps, 2 inputs",41],
    ["100 ramps, 20 inputs",2201]
  ];
  document.getElementById("countArea").innerHTML=`<div class="note" style="font-size:20px;text-align:center"><b>Would you like to tune all of these by hand?</b><br><br>Lesson 4 will show how gradients tell every parameter which way to move.</div><div class="countCard">`+
  examples.map(([name,n])=>`<div class="countItem"><div>${name}</div><div class="countBig">${n}</div><div>trainable parameters</div></div>`).join("")+`</div>`;
}
function matHtml(rows,cls,cap){
  const inner=rows.map(r=>`<div class="mrow">`+r.map(t=>`<div class="cell ${cls}">${t}</div>`).join("")+`</div>`).join("");
  return `<div><div class="mat">${inner}</div><div class="matCap">${cap}</div></div>`;
}
function renderMatrixScene(){
  document.getElementById("network").style.display="none";
  const sub=subscriptNumber, step=state.matrixStep||0;
  let body="";
  if(step===0){
    let rows="";
    for(let i=1;i<=3;i++){
      rows+=`<div class="cell" style="font-size:18px;margin:9px 0">ReLU( <span class="param">w${sub(i)}${sub(1)}</span>x₁ + <span class="param">w${sub(i)}${sub(2)}</span>x₂ <span class="hl"><span class="param">+ w${sub(i)}${sub(3)}</span>x₃</span> + <span class="param">b${sub(i)}</span> )</div>`;
    }
    body=`<div class="mxTitle">Step 1 · Add a third input feature x₃</div>
      <div class="mxRow" style="flex-direction:column;gap:2px">${rows}</div>
      <div class="mxNote">Each ramp already blends <span class="param">weights</span> with the <b>input features</b> (x₁, x₂ — shown in black). Adding a new feature <b>x₃</b> simply adds <b>one more weighted term per ramp</b> — the new <span class="param">weights w₁₃, w₂₃, w₃₃</span> (highlighted). Nothing else about the machine changes. <br><span style="font-size:13px;color:#555">Subscript convention: <span class="param">wᵢⱼ</span> = weight from input <b>j</b> into ramp <b>i</b>.</span></div>`;
  }else if(step===1){
    body=`<div class="mxTitle">Step 2 · The whole layer is one matrix multiply</div>
      <div class="mxRow">
        ${matHtml([["w₁₁","w₁₂","w₁₃"],["w₂₁","w₂₂","w₂₃"],["w₃₁","w₃₂","w₃₃"]],"param","W · weights (3 ramps × 3 inputs)")}
        <div class="op">×</div>
        ${matHtml([["x₁"],["x₂"],["x₃"]],"","x · features")}
        <div class="op">+</div>
        ${matHtml([["b₁"],["b₂"],["b₃"]],"param","b · biases")}
        <div class="op">=</div>
        ${matHtml([["h₁"],["h₂"],["h₃"]],"","ramp inputs")}
      </div>
      <div class="mxRow"><div class="cell" style="font-size:17px">then&nbsp; y = <span class="param">[a₁ a₂ a₃]</span> · ReLU(h) + <span class="param">bias</span></div></div>
      <div class="mxNote">Every weighted arrow in the network diagram is just one entry of the matrix <span class="param">W</span>. Computing all three ramp inputs at once is exactly <b>one matrix × vector</b>: <span class="param">W</span>·x + <span class="param">b</span>. ReLU then bends each entry, the output weights <span class="param">a</span> combine them, and the <span class="param">bias</span> shifts the final answer.</div>`;
  }else{
    body=`<div class="mxTitle">Step 3 · Many shots at once → matrix × matrix</div>
      <div class="mxRow">
        ${matHtml([["w₁₁","w₁₂","w₁₃"],["w₂₁","w₂₂","w₂₃"],["w₃₁","w₃₂","w₃₃"]],"param","W · fixed weights")}
        <div class="op">×</div>
        ${matHtml([["x₁","x₁","x₁","…"],["x₂","x₂","x₂","…"],["x₃","x₃","x₃","…"]],"","X · one column per shot")}
        <div class="op">=</div>
        ${matHtml([["h₁","h₁","h₁","…"],["h₂","h₂","h₂","…"],["h₃","h₃","h₃","…"]],"","H · ramp inputs for every shot")}
      </div>
      <div class="mxRow"><div class="cell" style="font-size:16px">→ <span class="param">a</span> · ReLU(H) + <span class="param">bias</span> &nbsp;⇒&nbsp; y₁ y₂ y₃ … &nbsp;(one make-probability per shot)</div></div>
      <div class="mxNote"><b>Stack many shots side by side</b> and the layer becomes a <b>matrix × matrix</b> multiply (engineers call it a "GEMM"). At <b>inference</b> the weights <span class="param">W</span> are already known and never change — only the inputs <b>X</b> differ. So a whole neural network is really a stack of big matrix multiplies. Speed up matrix multiplication and you speed up <i>every</i> prediction — which is exactly why companies like <b>NVIDIA</b> and <b>AMD</b> pour so much into hardware (GPUs / TPUs) dedicated to fast matrix multiplication.</div>`;
  }
  document.getElementById("plotArea").innerHTML=`<div class="mxScene">${body}</div>`;
}
function renderScene(){
  document.getElementById("network").style.display="none";
  document.getElementById("countArea").innerHTML="";
  if(typeof Plotly === "undefined" && state.scene<=7){
    document.getElementById("plotArea").innerHTML='<div class="note" style="font-size:16px">Couldn\'t load the 3D plotting library (Plotly). This lesson needs an internet connection the first time it opens — please reconnect and reload the page.</div>';
    return;
  }
  if(state.scene===0)renderSingleRamp(false);
  else if(state.scene===1)renderSingleRamp(true);
  else if(state.scene===2)renderSplit();
  else if(state.scene===3)renderReality();
  else if(state.scene===4)renderFitScene(1);
  else if(state.scene===5)renderFitScene(2);
  else if(state.scene===6)renderFitScene(3);
  else if(state.scene===7)renderNetwork();
  else if(state.scene===8)renderMatrixScene();
  else renderCounts();
}
let renderTimer=null;
function updateControlReadout(target){
  if(target.dataset.path){
    const id="readout_"+target.dataset.path.replaceAll(".","_");
    const el=document.getElementById(id);
    if(el){
      const step=Number(target.dataset.step||1);
      el.textContent=Number(target.value).toFixed(step<1?2:0);
    }
  }
  const k=state.scene===4?1:state.scene===5?2:state.scene>=6&&state.scene<=7?3:activeK();
  const err=document.getElementById("errorBox");
  if(err&&state.scene>=4&&state.scene<=7)err.textContent="Error: "+rmse(k).toFixed(3);
  const eq=document.getElementById("modelEq");
  if(eq&&state.scene>=4&&state.scene<=7)eq.textContent=equation(k);
}
function scheduleRender(){
  clearTimeout(renderTimer);
  renderTimer=setTimeout(()=>renderScene(),75);
}
function updateHeader(){
  document.getElementById("sceneNo").textContent=`Scene ${state.scene+1} of 10`;
  document.getElementById("question").textContent=scenes[state.scene][0];
  document.getElementById("sentence").textContent=scenes[state.scene][1];
  document.getElementById("prev").disabled=state.scene===0;
  document.getElementById("next").textContent=state.scene===9?"Done":"Next →";
  document.getElementById("plotToolbar").style.display=state.scene<=7?"flex":"none";
}
function buildScene(){
  updateHeader();
  buildControls();
  document.getElementById("plotArea").innerHTML="";
  renderScene();
}
document.getElementById("controls").addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.path)setPath(t.dataset.path,Number(t.value));
  else if(t.dataset.a!==undefined)state.ramps[Number(t.dataset.a)].a=Number(t.value);
  updateControlReadout(t);
});

document.getElementById("controls").addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.path)setPath(t.dataset.path,Number(t.value));
  else if(t.dataset.a!==undefined)state.ramps[Number(t.dataset.a)].a=Number(t.value);
  buildControls();
  renderScene();
});
document.getElementById("controls").addEventListener("click",e=>{
  if(e.target.id==="best"){bestFit();return}
  if(e.target.dataset.step!==undefined){state.matrixStep=Number(e.target.dataset.step);buildControls();renderScene();}
});
document.getElementById("resetView").onclick=resetView;
document.getElementById("prev").onclick=()=>{if(state.scene>0){state.scene--;buildScene()}};
document.getElementById("next").onclick=()=>{if(state.scene<9){state.scene++;buildScene()}};
buildScene();
</script>
